mapper:
  namespace: devices
  objects:
    - id: listDevices
      sequence: select
      query: >
        SELECT
          d.device_id,
          d.type,
          d.addr,
          d.name,
          d.model,
          COALESCE(dh.online_state, 0) AS online_state,
          COALESCE(dh.video_state, 0) AS video_state,
          COUNT(c.channel_id) AS channel_count
        FROM devices d
        LEFT JOIN device_health dh ON dh.device_id = d.device_id
        LEFT JOIN channels c ON c.device_id = d.device_id
          AND c.enabled = true
        GROUP BY
          d.device_id,
          d.type,
          d.addr,
          d.name,
          d.model,
          dh.online_state,
          dh.video_state
        ORDER BY d.device_id
        LIMIT #{limit}
        OFFSET #{offset}

    - id: getDeviceById
      sequence: select
      query: >
        SELECT
          d.device_id,
          d.type,
          d.addr,
          d.name,
          d.model,
          COALESCE(dh.online_state, 0) AS online_state,
          COALESCE(dh.video_state, 0) AS video_state,
          COUNT(c.channel_id) AS channel_count
        FROM devices d
        LEFT JOIN device_health dh ON dh.device_id = d.device_id
        LEFT JOIN channels c ON c.device_id = d.device_id
          AND c.enabled = true
        WHERE d.device_id = #{device_id}
        GROUP BY
          d.device_id,
          d.type,
          d.addr,
          d.name,
          d.model,
          dh.online_state,
          dh.video_state
        LIMIT 1

    - id: updateDeviceName
      sequence: update
      query: >
        UPDATE devices
        SET name = #{name}
        WHERE device_id = #{device_id}

    - id: listDeviceChannels
      sequence: select
      query: >
        SELECT
          c.channel_id,
          c.channel_no,
          c.name,
          p.video_codec,
          p.audio_codec,
          COALESCE(c.service_rtsp_url, p.cctv_rtsp_url) AS rtsp
        FROM channels c
        LEFT JOIN LATERAL (
          SELECT
            profile_id,
            video_codec,
            audio_codec,
            cctv_rtsp_url
          FROM profiles
          WHERE channel_id = c.channel_id
            AND enabled = true
          ORDER BY
            CASE
              WHEN c.use_profile IS NOT NULL
                AND profile_no = c.use_profile THEN 0
              ELSE 1
            END,
            profile_no,
            profile_id
          LIMIT 1
        ) p ON true
        WHERE c.device_id = #{device_id}
          AND c.enabled = true
        ORDER BY c.channel_no, c.channel_id


    - id: getPtzTargetByChannelId
      sequence: select
      query: >
        SELECT
          c.channel_id,
          d.device_id,
          d.ptz_xaddr,
          d.username,
          d.password_enc,
          p.onvif_profile_token AS profile_token,
          pc.channel_id AS capability_channel_id,
          pc.supports_pan,
          pc.supports_tilt,
          pc.supports_zoom,
          pc.supports_tour,
          pc.supports_linear
        FROM channels c
        INNER JOIN devices d ON d.device_id = c.device_id
        LEFT JOIN ptz_capabilities pc ON pc.channel_id = c.channel_id
        LEFT JOIN LATERAL (
          SELECT onvif_profile_token
          FROM profiles
          WHERE channel_id = c.channel_id
            AND enabled = true
            AND onvif_profile_token IS NOT NULL
            AND onvif_profile_token <> ''
          ORDER BY
            CASE
              WHEN c.use_profile IS NOT NULL
                AND profile_no = c.use_profile THEN 0
              ELSE 1
            END,
            profile_no,
            profile_id
          LIMIT 1
        ) p ON true
        WHERE c.channel_id = #{channel_id}
          AND c.enabled = true
        LIMIT 1

    - id: listChannelPresets
      sequence: select
      query: >
        SELECT
          preset_id,
          channel_id,
          preset_token,
          preset_name,
          pan,
          tilt,
          zoom,
          linear
        FROM ptz_preset
        WHERE channel_id = #{channel_id}
        ORDER BY preset_id

    - id: getChannelPresetById
      sequence: select
      query: >
        SELECT
          preset_id,
          channel_id,
          preset_token,
          preset_name,
          pan,
          tilt,
          zoom,
          linear
        FROM ptz_preset
        WHERE channel_id = #{channel_id}
          AND preset_id = #{preset_id}
        LIMIT 1

    - id: upsertChannelPreset
      sequence: insert
      query: >
        INSERT INTO ptz_preset (
          channel_id,
          preset_token,
          preset_name,
          created_at,
          updated_at
        ) VALUES (
          #{channel_id},
          #{preset_token},
          #{preset_name},
          NOW(),
          NOW()
        )
        ON CONFLICT (channel_id, preset_token)
        WHERE preset_token IS NOT NULL AND preset_token <> ''
        DO UPDATE SET
          preset_name = EXCLUDED.preset_name,
          updated_at = NOW()

    - id: updateChannelPresetName
      sequence: update
      query: >
        UPDATE ptz_preset
        SET
          preset_name = #{preset_name},
          updated_at = NOW()
        WHERE channel_id = #{channel_id}
          AND preset_id = #{preset_id}

    - id: deleteChannelPreset
      sequence: delete
      query: >
        DELETE FROM ptz_preset
        WHERE channel_id = #{channel_id}
          AND preset_id = #{preset_id}


    - id: listChannelTours
      sequence: select
      query: >
        SELECT
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          COALESCE(t.schedule_enabled, false) AS schedule_enabled,
          COALESCE(t.is_enabled, false) AS is_enabled,
          COUNT(i.tour_item_id) AS item_count
        FROM ptz_tours t
        LEFT JOIN ptz_tours_items i ON i.tour_id = t.tour_id
        WHERE t.channel_id = #{channel_id}
        GROUP BY
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          t.schedule_enabled,
          t.is_enabled
        ORDER BY t.tour_id

    - id: getChannelTourById
      sequence: select
      query: >
        SELECT
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          COALESCE(t.schedule_enabled, false) AS schedule_enabled,
          COALESCE(t.is_enabled, false) AS is_enabled,
          COUNT(i.tour_item_id) AS item_count
        FROM ptz_tours t
        LEFT JOIN ptz_tours_items i ON i.tour_id = t.tour_id
        WHERE t.channel_id = #{channel_id}
          AND t.tour_id = #{tour_id}
        GROUP BY
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          t.schedule_enabled,
          t.is_enabled
        LIMIT 1

    - id: getChannelTourByToken
      sequence: select
      query: >
        SELECT
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          COALESCE(t.schedule_enabled, false) AS schedule_enabled,
          COALESCE(t.is_enabled, false) AS is_enabled,
          COUNT(i.tour_item_id) AS item_count
        FROM ptz_tours t
        LEFT JOIN ptz_tours_items i ON i.tour_id = t.tour_id
        WHERE t.channel_id = #{channel_id}
          AND t.tour_token = #{tour_token}
        GROUP BY
          t.tour_id,
          t.channel_id,
          t.tour_token,
          t.tour_name,
          t.repeat_mode,
          t.schedule_enabled,
          t.is_enabled
        LIMIT 1

    - id: upsertChannelTour
      sequence: insert
      query: >
        INSERT INTO ptz_tours (
          channel_id,
          tour_token,
          tour_name,
          repeat_mode,
          schedule_enabled,
          is_enabled,
          created_at
        ) VALUES (
          #{channel_id},
          #{tour_token},
          #{tour_name},
          #{repeat_mode},
          #{schedule_enabled},
          #{is_enabled},
          NOW()
        )
        ON CONFLICT (channel_id, tour_token)
        WHERE tour_token IS NOT NULL AND tour_token <> ''
        DO UPDATE SET
          tour_name = EXCLUDED.tour_name,
          repeat_mode = EXCLUDED.repeat_mode,
          schedule_enabled = EXCLUDED.schedule_enabled,
          is_enabled = EXCLUDED.is_enabled

    - id: listChannelTourItems
      sequence: select
      query: >
        SELECT
          i.tour_item_id,
          i.tour_id,
          i.preset_id,
          p.preset_token,
          p.preset_name,
          COALESCE(i.seq_no, 0) AS seq_no,
          COALESCE(i.stay_seconds, 0) AS stay_seconds,
          COALESCE(i.move_speed, 0) AS move_speed
        FROM ptz_tours_items i
        INNER JOIN ptz_preset p ON p.preset_id = i.preset_id
        WHERE i.tour_id = #{tour_id}
        ORDER BY i.seq_no, i.tour_item_id

    - id: deleteChannelTourItems
      sequence: delete
      query: >
        DELETE FROM ptz_tours_items
        WHERE tour_id = #{tour_id}

    - id: insertChannelTourItem
      sequence: insert
      query: >
        INSERT INTO ptz_tours_items (
          tour_id,
          preset_id,
          seq_no,
          stay_seconds,
          move_speed
        ) VALUES (
          #{tour_id},
          #{preset_id},
          #{seq_no},
          #{stay_seconds},
          #{move_speed}
        )

    - id: deleteChannelTour
      sequence: delete
      query: >
        DELETE FROM ptz_tours
        WHERE channel_id = #{channel_id}
          AND tour_id = #{tour_id}
